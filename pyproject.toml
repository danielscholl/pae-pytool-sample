[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pae-pytool-sample"
version = "0.1.0"
description = "Tiny text-statistics CLI — a sample repo for testing the plan-act-evaluate workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Scholl" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pae-pytool = "pae_pytool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pae_pytool"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
